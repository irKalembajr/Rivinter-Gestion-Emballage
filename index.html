<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIVINTER SARLU - Gestion des emballages</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <img class="auth-logo" src="/logo-rivinter.png" alt="Logo Rivinter SARLU">
      <h1>Gestion des emballages</h1>
      <p>Connexion sécurisée à la base en ligne Rivinter.</p>
      <form id="loginForm" class="auth-form">
        <label>Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Mot de passe
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Se connecter</button>
      </form>
      <form id="signupForm" class="auth-form hidden">
        <label>Nom complet
          <input name="fullName" autocomplete="name" required>
        </label>
        <label>Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Mot de passe
          <input name="password" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <button type="submit">Créer le premier accès</button>
      </form>
      <button id="toggleSignup" class="link-button" type="button">Créer un compte initial</button>
      <p id="authMessage" class="message"></p>
    </div>
  </section>

  <div id="appShell" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <img src="/logo-rivinter.png" alt="Logo Rivinter SARLU">
        <div>
          <strong>RIVINTER SARLU</strong>
          <span>Emballages Brasimba</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="session-box">
        <strong id="profileName">Utilisateur</strong>
        <span id="profileRole">Session</span>
        <button id="logoutBtn" class="secondary" type="button">Déconnexion</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSubtitle">Vue globale des emballages.</p>
        </div>
        <div class="filters">
          <label>Mois
            <input id="monthFilter" type="month">
          </label>
          <label>Site / axe
            <select id="locationFilter"></select>
          </label>
          <label class="mobile-only">Module
            <select id="mobileView"></select>
          </label>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
